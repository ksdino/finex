<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: white;
            color: black;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .balance-card {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .balance {
            font-size: 24px;
            font-weight: bold;
        }

        .input-form {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            margin-top: 5px;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            background-color: black;
            color: white;
        }

        button.expense {
            background-color: white;
            color: black;
            border: 2px solid black;
        }

        .transactions {
            background-color: white;
            border: 2px solid black;
            padding: 20px;
            border-radius: 10px;
        }

        .transaction-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .transaction-info {
            flex: 1;
        }

        .transaction-amount {
            font-weight: bold;
        }

        .transaction-amount.income {
            color: black;
        }

        .transaction-amount.expense {
            color: #666;
        }

        .transaction-date {
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="balance-card">
        <div class="balance">Balance: $<span id="balance">0.00</span></div>
    </div>

    <div class="input-form">
        <div class="input-group">
            <input type="text" id="description" placeholder="Description">
        </div>
        <div class="input-group">
            <input type="number" id="amount" placeholder="Amount" step="0.01">
        </div>
        <div class="button-group">
            <button onclick="addTransaction('income')">Add Income</button>
            <button class="expense" onclick="addTransaction('expense')">Add Expense</button>
        </div>
    </div>

    <div class="transactions" id="transactionsList"></div>

    <script>
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let balance = parseFloat(localStorage.getItem('balance')) || 0;

        function updateDisplay() {
            document.getElementById('balance').textContent = balance.toFixed(2);
            
            const transactionsList = document.getElementById('transactionsList');
            transactionsList.innerHTML = '';
            
            transactions.forEach(transaction => {
                const div = document.createElement('div');
                div.className = 'transaction-item';
                
                div.innerHTML = `
                    <div class="transaction-info">
                        <div>${transaction.description}</div>
                        <div class="transaction-date">${transaction.date}</div>
                    </div>
                    <div class="transaction-amount ${transaction.type}">
                        ${transaction.type === 'income' ? '+' : '-'}$${Math.abs(transaction.amount).toFixed(2)}
                    </div>
                `;
                
                transactionsList.appendChild(div);
            });
        }

        function addTransaction(type) {
            const description = document.getElementById('description').value;
            const amount = parseFloat(document.getElementById('amount').value);
            
            if (!description || !amount || isNaN(amount)) {
                alert('Please enter both description and amount');
                return;
            }

            const transaction = {
                id: Date.now(),
                description,
                amount,
                type,
                date: new Date().toLocaleDateString()
            };

            transactions.unshift(transaction);
            balance += type === 'income' ? amount : -amount;

            localStorage.setItem('transactions', JSON.stringify(transactions));
            localStorage.setItem('balance', balance.toString());

            document.getElementById('description').value = '';
            document.getElementById('amount').value = '';

            updateDisplay();
        }

        // Initial display
        updateDisplay();
    </script>
</body>
</html>
